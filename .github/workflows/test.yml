name: Test

on:
  push:
    branches: [main, feat/uist-user-study-system]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run test:lint
      - run: npm run test:format
      - run: npm run test:js -- --run
